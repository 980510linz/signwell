<section class="lock" id="lockScreen"><div class="lock-card"><div class="lock-mark">欣</div><h1 id="lockTitle">SIGN WELL CMS</h1><p id="lockDesc">欣緯生醫 · 私人文章工作台</p><div class="auth-progress" aria-label="雙重驗證進度"><span class="active" id="authDot1">1</span><i></i><span id="authDot2">2</span></div><div class="auth-step" id="authStep1"><div class="auth-label">第一階段 · 管理密碼</div><input class="pin" id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" placeholder="輸入管理密碼"><button id="unlockBtn">繼續</button></div><div class="auth-step hidden" id="authStep2"><div class="auth-label">第二階段 · 安全問題</div><div class="security-question">王黃彩雲住哪一個島</div><input class="pin answer-input" id="answerInput" type="text" autocomplete="off" maxlength="20" placeholder="輸入答案"><button id="verifyBtn">驗證並進入</button><button class="auth-back" id="authBackBtn" type="button">返回第一階段</button></div><small id="lockHint">需要完成兩階段驗證才能進入後台。純前端驗證只能作為本機隱私鎖，無法等同伺服器端 2FA。</small></div></section>
<section class="cms hidden" id="cms">

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const KEY='signwell-cms-data-v1',ACTKEY='signwell-cms-last-active',AUTH_PASS_HASH='d27a6055',AUTH_ANSWER_HASH='be64c71a';let data={articles:[]},currentId=null,viewName='dashboard',deleteId=null,saveTimer=null,authStage=1;
const clone=x=>JSON.parse(JSON.stringify(x));
function hashPin(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function load(){try{const saved=localStorage.getItem(KEY);data=saved?JSON.parse(saved):{articles:clone(window.BLOG_ARTICLES||[])};if(!Array.isArray(data.articles))data.articles=[]}catch(_){data={articles:clone(window.BLOG_ARTICLES||[])}}}
function persist(silent=false){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(ACTKEY,String(Date.now()));if(!silent){$('#saveState').textContent='Saved ✓';$('#saveState').style.color='#6f8f86'}}catch(_){$('#saveState').textContent='Storage unavailable';$('#saveState').style.color='#a65c65'}}
function showToast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),1700)}
function slugify(s){return String(s||'').toLowerCase().trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,80)||('article-'+Date.now())}
function escapeHTML(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function inlineMD(s){return escapeHTML(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function markdown(md=''){const lines=md.replace(/\r/g,'').split('\n');let out='',list=null;const close=()=>{if(list){out+=`</${list}>`;list=null}};for(let i=0;i<lines.length;i++){const line=lines[i].trim();if(!line){close();continue}const c=line.match(/^> \[!(PEARL|KEY|WARNING)\]/i);if(c){close();const kind=c[1].toLowerCase(),next=(lines[++i]||'').replace(/^>\s?/,'');out+=`<div class="callout"><b>${kind==='pearl'?'Clinical Pearl':kind==='key'?'Key Point':'Warning'}</b><p>${inlineMD(next)}</p></div>`;continue}if(/^###\s+/.test(line)){close();out+=`<h3>${inlineMD(line.replace(/^###\s+/,''))}</h3>`;continue}if(/^##\s+/.test(line)){close();out+=`<h2>${inlineMD(line.replace(/^##\s+/,''))}</h2>`;continue}const ol=line.match(/^\d+\.\s+(.+)/);if(ol){if(list!=='ol'){close();list='ol';out+='<ol>'}out+=`<li>${inlineMD(ol[1])}</li>`;continue}const ul=line.match(/^[-*]\s+(.+)/);if(ul){if(list!=='ul'){close();list='ul';out+='<ul>'}out+=`<li>${inlineMD(ul[1])}</li>`;continue}close();out+=`<p>${inlineMD(line)}</p>`}close();return out}
function setAuthStage(stage){authStage=stage;const second=stage===2;$('#authStep1').classList.toggle('hidden',second);$('#authStep2').classList.toggle('hidden',!second);$('#authDot1').classList.toggle('active',!second);$('#authDot1').classList.toggle('done',second);$('#authDot2').classList.toggle('active',second);if(second){$('#lockHint').textContent='第一階段已通過。請回答安全問題完成第二階段驗證。';setTimeout(()=>$('#answerInput').focus(),40)}else{$('#answerInput').value='';$('#lockHint').textContent='需要完成兩階段驗證才能進入後台。純前端驗證只能作為本機隱私鎖，無法等同伺服器端 2FA。';setTimeout(()=>$('#pinInput').focus(),40)}}
function unlock(){const pin=$('#pinInput').value.trim();if(hashPin(pin)!==AUTH_PASS_HASH){$('#lockHint').textContent='管理密碼不正確。';$('#pinInput').select();return}$('#pinInput').value='';setAuthStage(2)}
function verifySecond(){const answer=$('#answerInput').value.trim().replace(/\s+/g,'');if(hashPin(answer)!==AUTH_ANSWER_HASH){$('#lockHint').textContent='安全問題答案不正確。';$('#answerInput').select();return}$('#answerInput').value='';$('#lockScreen').classList.add('hidden');$('#cms').classList.remove('hidden');localStorage.setItem(ACTKEY,String(Date.now()));setAuthStage(1);renderView();showToast('雙重驗證完成')}
function lock(){persist(true);$('#cms').classList.add('hidden');$('#lockScreen').classList.remove('hidden');$('#pinInput').value='';$('#answerInput').value='';setAuthStage(1)}
function checkAutoLock(){const last=Number(localStorage.getItem(ACTKEY)||0);if(last&&Date.now()-last>15*60*1000&&!$('#cms').classList.contains('hidden'))lock()}
function nav(v){viewName=v;currentId=null;$$('.nav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));renderView()}
function renderView(){const editing=Boolean(currentId);$('#previewBtn').classList.toggle('hidden',!editing);$('#saveBtn').classList.toggle('hidden',!editing);$('#publishBtn').classList.toggle('hidden',!editing);$('#onlineBtn').classList.toggle('hidden',!editing);if(editing){$('#topTitle').textContent='Article Editor';renderEditor();return}$('#topTitle').textContent=viewName==='dashboard'?'Overview':viewName==='articles'?'Articles':'Publish Online';if(viewName==='articles')renderArticles();else if(viewName==='export')renderExport();else renderDashboard()}
function renderDashboard(){const published=data.articles.filter(a=>a.status==='Published').length,drafts=data.articles.filter(a=>a.status!=='Published').length,cats=new Set(data.articles.map(a=>a.category).filter(Boolean)).size;$('#view').innerHTML=`<div class="page-head"><div><h1>Overview</h1><p>你的私人純前端文章工作台。</p></div><button class="top-action primary" id="dashNew">New Article</button></div><div class="stats"><div class="stat"><span>Total Articles</span><strong>${data.articles.length}</strong></div><div class="stat"><span>Published</span><strong>${published}</strong></div><div class="stat"><span>Drafts</span><strong>${drafts}</strong></div><div class="stat"><span>Topics</span><strong>${cats}</strong></div></div><section class="panel"><div class="panel-head"><span>Recent Articles</span><span>${data.articles.length} notes</span></div>${data.articles.length?data.articles.slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).slice(0,6).map(rowHTML).join(''):'<div class="empty">尚未建立文章。</div>'}</section>`;$('#dashNew').onclick=newArticle;bindRows()}
function rowHTML(a){return `<div class="article-row" data-edit="${escapeHTML(a.id)}"><div><strong>${escapeHTML(a.title||'Untitled')}</strong><small>${escapeHTML(a.category||'Uncategorized')} · ${escapeHTML(a.updatedAt||'')}</small></div><div>${escapeHTML(a.category||'—')}</div><div><span class="badge ${a.status==='Published'?'':'draft'}">${escapeHTML(a.status||'Draft')}</span></div><div class="row-actions"><button title="Duplicate" data-dup="${escapeHTML(a.id)}">⧉</button><button title="Delete" data-del="${escapeHTML(a.id)}">×</button></div></div>`}
function renderArticles(){const q='';$('#view').innerHTML=`<div class="page-head"><div><h1>Articles</h1><p>Published 文章會立即同步到同網域的前台預覽；正式公開網站仍可 Export articles.js 部署。</p></div><input class="searchbar" id="articleSearch" placeholder="Search articles…"></div><section class="panel" id="articlePanel"><div class="panel-head"><span>All Articles</span><button class="top-action primary" id="listNew">New</button></div><div id="rows">${data.articles.length?data.articles.map(rowHTML).join(''):'<div class="empty">尚未建立文章。</div>'}</div></section>`;$('#listNew').onclick=newArticle;$('#articleSearch').oninput=e=>filterRows(e.target.value);bindRows()}
function filterRows(q){const s=q.toLowerCase().trim(),arr=data.articles.filter(a=>[a.title,a.category,(a.tags||[]).join(' ')].join(' ').toLowerCase().includes(s));$('#rows').innerHTML=arr.length?arr.map(rowHTML).join(''):'<div class="empty">沒有符合的文章。</div>';bindRows()}
function bindRows(){$$('[data-edit]').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-dup],[data-del]'))return;currentId=r.dataset.edit;renderView()});$$('[data-dup]').forEach(b=>b.onclick=e=>{e.stopPropagation();duplicateArticle(b.dataset.dup)});$$('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteId=b.dataset.del;$('#confirmModal').classList.add('show')})}
function newArticle(){const id='a-'+Date.now();const today=new Date().toISOString().slice(0,10);data.articles.unshift({id,title:'',subtitle:'',slug:'',category:'Medical Notes',type:'Article',excerpt:'',tags:[],cover:'',status:'Draft',featured:false,publishedAt:today,updatedAt:today,content:'<p>從這裡開始寫。</p>',contentFormat:'html',references:[]});persist(true);currentId=id;renderView();setTimeout(()=>$('#title')?.focus(),50)}
function duplicateArticle(id){const src=data.articles.find(a=>a.id===id);if(!src)return;const cp=clone(src);cp.id='a-'+Date.now();cp.title=(src.title||'Untitled')+' Copy';cp.slug=slugify(cp.title);cp.status='Draft';cp.featured=false;data.articles.unshift(cp);persist();showToast('已複製文章');renderView()}
function getCurrent(){return data.articles.find(a=>a.id===currentId)}
function articleHTML(a){return a?.contentFormat==='html'?String(a.content||''):markdown(a?.content||'')}
function plainFromHTML(html=''){const el=document.createElement('div');el.innerHTML=html;return (el.textContent||'').replace(/\s+/g,' ').trim()}
function renderEditor(){const a=getCurrent();if(!a){currentId=null;nav('articles');return}const html=articleHTML(a);$('#view').innerHTML=`<div class="editor-grid"><section class="editor-main"><input id="title" class="title-input" placeholder="貼文標題" value="${escapeHTML(a.title||'')}"><div class="cover-box ${a.cover?'has-image':''}" id="coverBox">${a.cover?`<img id="coverPreview" src="${escapeHTML(a.cover)}" alt="封面圖片"><div class="cover-actions"><button id="changeCover" type="button">更換圖片</button><button id="removeCover" type="button">移除</button></div>`:`<div class="cover-empty"><strong>貼文圖片</strong><br>點一下加入封面圖片；系統會自動壓縮成適合網頁的大小。</div>`}</div><input class="file-input" id="coverInput" type="file" accept="image/*"><input class="file-input" id="inlineImageInput" type="file" accept="image/*"><div class="toolbar sticky-tools"><button type="button" data-cmd="formatBlock" data-val="p">內文</button><button type="button" data-cmd="formatBlock" data-val="h2">H2</button><button type="button" data-cmd="formatBlock" data-val="h3">H3</button><span class="tool-sep"></span><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><button type="button" data-link="1">Link</button><span class="tool-sep"></span><button type="button" data-cmd="insertUnorderedList">• List</button><button type="button" data-cmd="insertOrderedList">1. List</button><button type="button" data-quote="1">Quote</button><button type="button" id="insertImageBtn">Image</button></div><div id="content" class="doc-editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true">${html}</div></section><aside class="editor-side"><div class="field-group"><label>發布狀態</label><select id="status"><option ${a.status==='Draft'?'selected':''}>Draft</option><option ${a.status==='Published'?'selected':''}>Published</option></select></div><div class="field-group"><label>公開網址</label><input id="slug" value="${escapeHTML(a.slug||'')}"></div><div class="field-group"><label>發布日期</label><input id="publishedAt" type="date" value="${escapeHTML(a.publishedAt||'')}"></div><div class="field-group"><label>同步狀態</label><div style="font-size:11px;color:#74818d;line-height:1.7">按 Publish 會更新本機預覽；設定 GitHub 後可直接按右上角 Publish Online，同步到公開 GitHub Pages。</div></div></aside></div>`;bindEditor()}
function bindEditor(){['title','slug','publishedAt','status'].forEach(id=>{const el=$('#'+id);el?.addEventListener('input',scheduleSave);el?.addEventListener('change',scheduleSave)});$('#content')?.addEventListener('input',scheduleSave);$$('[data-cmd]').forEach(b=>b.onclick=()=>runCommand(b.dataset.cmd,b.dataset.val||null));$$('[data-link]').forEach(b=>b.onclick=()=>{const url=prompt('輸入連結網址');if(url)runCommand('createLink',url)});$$('[data-quote]').forEach(b=>b.onclick=()=>runCommand('formatBlock','blockquote'));$('#insertImageBtn').onclick=()=>$('#inlineImageInput').click();$('#inlineImageInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const url=await compressImage(f,1400,.82);insertHTMLAtCursor(`<img src="${url}" alt="文章圖片">`);scheduleSave()}catch(_){showToast('圖片處理失敗')}e.target.value=''};$('#coverBox').onclick=e=>{if(e.target.closest('#removeCover,#changeCover'))return;$('#coverInput').click()};$('#changeCover')?.addEventListener('click',e=>{e.stopPropagation();$('#coverInput').click()});$('#removeCover')?.addEventListener('click',e=>{e.stopPropagation();const a=getCurrent();a.cover='';persist(true);renderEditor();scheduleSave()});$('#coverInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;showToast('正在壓縮圖片…');try{const url=await compressImage(f,1600,.82);const a=getCurrent();a.cover=url;persist(true);renderEditor();showToast('圖片已加入')}catch(_){showToast('圖片處理失敗')}e.target.value=''}}
function updateFromEditor(){const a=getCurrent();if(!a)return;a.title=$('#title').value.trim();a.content=$('#content').innerHTML;a.contentFormat='html';a.status=$('#status').value;a.slug=$('#slug').value.trim()||slugify(a.title);a.category=a.category||'Medical Notes';a.type='Article';a.subtitle='';a.excerpt=plainFromHTML(a.content).slice(0,180);a.tags=a.tags||[];a.publishedAt=$('#publishedAt').value||new Date().toISOString().slice(0,10);a.updatedAt=new Date().toISOString().slice(0,10)}
function syncPublicSnapshot(){try{const pub=data.articles.filter(a=>a.status==='Published');localStorage.setItem('signwell-public-live-v1',JSON.stringify({updatedAt:Date.now(),articles:pub}))}catch(_){}}
function scheduleSave(){clearTimeout(saveTimer);$('#saveState').textContent='Saving…';$('#saveState').style.color='#8b97a2';saveTimer=setTimeout(()=>{updateFromEditor();persist();syncPublicSnapshot()},700)}
function saveNow(){clearTimeout(saveTimer);updateFromEditor();if($('#status').value==='Published')$('#status').value='Draft';getCurrent().status='Draft';persist();syncPublicSnapshot();showToast('已儲存草稿')}
function publishNow(){clearTimeout(saveTimer);updateFromEditor();const a=getCurrent();if(!a.title){showToast('請先輸入標題');$('#title').focus();return}a.status='Published';$('#status').value='Published';persist();syncPublicSnapshot();$('#saveState').textContent='Published ✓';$('#saveState').style.color='#6f8f86';showToast('已發布並同步到使用者端')}
function runCommand(cmd,val=null){$('#content').focus();try{document.execCommand(cmd,false,val)}catch(_){ }scheduleSave()}
function insertHTMLAtCursor(html){$('#content').focus();try{document.execCommand('insertHTML',false,html)}catch(_){const sel=getSelection();if(!sel?.rangeCount)return;const r=sel.getRangeAt(0);const t=document.createElement('template');t.innerHTML=html;r.deleteContents();r.insertNode(t.content);r.collapse(false)}}
function compressImage(file,maxSide=1600,quality=.82){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const scale=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);let out;try{out=c.toDataURL('image/webp',quality);if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/jpeg',quality)}catch(_){out=c.toDataURL('image/jpeg',quality)}resolve(out)};img.src=reader.result};reader.readAsDataURL(file)})}
function preview(){updateFromEditor();const a=getCurrent();$('#previewContent').innerHTML=`${a.cover?`<img src="${a.cover}" alt="" style="width:100%;max-height:420px;object-fit:cover;border-radius:22px;margin-bottom:28px">`:''}<h1>${escapeHTML(a.title||'Untitled')}</h1>${articleHTML(a)}`;$('#previewOverlay').classList.add('show')}
function renderExport(){const pub=data.articles.filter(a=>a.status==='Published');$('#view').innerHTML=`<div class="page-head"><div><h1>Publish Online</h1><p>第一次把公開檔案放上 GitHub Pages；之後可在這裡一鍵更新 articles.js。</p></div></div><div class="stats"><div class="stat"><span>Published</span><strong>${pub.length}</strong></div><div class="stat"><span>Drafts excluded</span><strong>${data.articles.length-pub.length}</strong></div><div class="stat"><span>Public file</span><strong style="font-size:20px">articles.js</strong></div><div class="stat"><span>Host</span><strong style="font-size:20px">GitHub Pages</strong></div></div><div class="publish-grid"><section class="publish-card"><h3>GitHub Pages · One-click Publish</h3><p>設定一次 Repository。之後文章設為 Published 後，按 Publish to GitHub 就會更新公開站的 articles.js。</p><div class="publish-form"><label>GitHub Owner<input id="ghOwner" autocomplete="off" placeholder="你的 GitHub 使用者名稱"></label><label>Repository<input id="ghRepo" autocomplete="off" placeholder="例如 signwell-biomed"></label><label>Branch<input id="ghBranch" value="main" autocomplete="off"></label><label>Public file path<input id="ghPath" value="articles.js" autocomplete="off"></label><label class="full">Fine-grained Personal Access Token<input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…（不會寫進檔案，也不會保存到 localStorage）"></label></div><div class="publish-actions"><button class="top-action" id="ghTest">Test Connection</button><button class="top-action online" id="ghPublish">Publish to GitHub</button><button class="top-action" id="exportJs">Download articles.js</button></div><div class="publish-status" id="ghStatus">Token 僅保存在這次開啟頁面的記憶體中；重新整理後需重新輸入。</div><div class="security-note"><b>安全提醒：</b>不要把 token 寫進 HTML，也不要把 admin.html 上傳到公開 GitHub Pages。GitHub token 請使用 Fine-grained token，Repository access 只選這個網站 repo，Permissions 只開 Contents: Read and write。</div></section><aside class="publish-card"><h3>公開 Repo 應該只有這些</h3><p>正式網站不需要後台檔案。這樣訪客下載原始碼也看不到 CMS UI。</p><div class="file-map"><div><code>index.html</code><span class="file-ok">UPLOAD</span></div><div><code>articles.js</code><span class="file-ok">UPLOAD</span></div><div><code>.nojekyll</code><span class="file-ok">UPLOAD</span></div><div><code>admin.html</code><span>KEEP LOCAL</span></div></div><div class="security-note">初次部署完成後，日常更新只會改 <code>articles.js</code>。GitHub Pages 設為 Deploy from a branch / main / /(root)。</div></aside></div>`;$('#exportJs').onclick=exportJS;bindGithubPublisher()}
async function saveBlob(blob,name){const file=new File([blob],name,{type:blob.type||'application/octet-stream'});try{if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e?.name==='AbortError')return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJS(){const pub=data.articles.filter(a=>a.status==='Published');const text='window.BLOG_ARTICLES = '+JSON.stringify(pub,null,2)+';\n';saveBlob(new Blob([text],{type:'text/javascript;charset=utf-8'}),'articles.js');showToast(`已準備 ${pub.length} 篇文章`)}
function exportBackup(){saveBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),'signwell-cms-backup.json')}
function importFile(file){const reader=new FileReader();reader.onload=()=>{try{let text=String(reader.result||''),obj;if(file.name.endsWith('.js')){const m=text.match(/window\.BLOG_ARTICLES\s*=\s*([\s\S]*);\s*$/);if(!m)throw new Error('Invalid articles.js');obj={articles:JSON.parse(m[1])}}else obj=JSON.parse(text);if(!obj||!Array.isArray(obj.articles))throw new Error('Invalid backup');data=obj;persist();showToast('匯入完成');nav('articles')}catch(e){showToast('匯入失敗：檔案格式不符')}};reader.readAsText(file)}
$('#unlockBtn').onclick=unlock;$('#verifyBtn').onclick=verifySecond;$('#authBackBtn').onclick=()=>setAuthStage(1);$('#pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('#answerInput').addEventListener('keydown',e=>{if(e.key==='Enter')verifySecond()});$$('.nav [data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));$$('[data-new]').forEach(b=>b.onclick=newArticle);$('#backupBtn').onclick=exportBackup;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const f=e.target.files?.[0];if(f)importFile(f);e.target.value=''};$('#lockBtn').onclick=lock;$('#saveBtn').onclick=saveNow;$('#publishBtn').onclick=publishNow;$('#onlineBtn').onclick=publishOnlineFromEditor;$('#previewBtn').onclick=preview;$('#previewClose').onclick=()=>$('#previewOverlay').classList.remove('show');$('#previewOverlay').onclick=e=>{if(e.target===$('#previewOverlay'))$('#previewOverlay').classList.remove('show')};$('#cancelDelete').onclick=()=>$('#confirmModal').classList.remove('show');$('#confirmDelete').onclick=()=>{data.articles=data.articles.filter(a=>a.id!==deleteId);persist();syncPublicSnapshot();$('#confirmModal').classList.remove('show');deleteId=null;renderView();showToast('文章已刪除')};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#previewOverlay').classList.remove('show');$('#confirmModal').classList.remove('show')}});['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(!$('#cms').classList.contains('hidden'))localStorage.setItem(ACTKEY,String(Date.now()))},{passive:true}));setInterval(checkAutoLock,60000);
function optimize(){const low=Number(navigator.deviceMemory||8)<4||matchMedia('(prefers-reduced-motion:reduce)').matches;if(low)document.body.classList.add('lite')}


const GITHUB_CFG_KEY='signwell-github-config-v1';let githubToken='';
function loadGithubConfig(){try{return JSON.parse(localStorage.getItem(GITHUB_CFG_KEY)||'{}')}catch(_){return {}}}
function saveGithubConfig(cfg){try{localStorage.setItem(GITHUB_CFG_KEY,JSON.stringify(cfg))}catch(_){}}
function publishedJSText(){const pub=data.articles.filter(a=>a.status==='Published');return 'window.BLOG_ARTICLES = '+JSON.stringify(pub,null,2)+';\n'}
function utf8Base64(text){const bytes=new TextEncoder().encode(text);let bin='';const step=0x8000;for(let i=0;i<bytes.length;i+=step)bin+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(bin)}
async function githubRequest(url,token,options={}){const res=await fetch(url,{...options,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...(options.headers||{})}});let body=null;try{body=await res.json()}catch(_){ }if(!res.ok)throw new Error(body?.message||('GitHub API '+res.status));return body}
async function publishGitHub(){
  const cfg=loadGithubConfig();
  const owner=$('#ghOwner')?.value.trim()||cfg.owner||'',repo=$('#ghRepo')?.value.trim()||cfg.repo||'',branch=$('#ghBranch')?.value.trim()||cfg.branch||'main',path=($('#ghPath')?.value.trim()||cfg.path||'articles.js').replace(/^\/+/,''),token=$('#ghToken')?.value.trim()||githubToken;
  const status=$('#ghStatus');
  if(!owner||!repo||!token){if(status)status.textContent='請填入 GitHub Owner、Repository 與 Fine-grained token。';return false}
  githubToken=token;saveGithubConfig({owner,repo,branch,path});if(status)status.textContent='正在讀取 GitHub 檔案狀態…';
  const base=`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  let sha=null;try{const existing=await githubRequest(base+'?ref='+encodeURIComponent(branch),token);sha=existing?.sha||null}catch(e){if(!/Not Found|404/i.test(e.message))throw e}
  if(status)status.textContent='正在提交 articles.js…';
  const payload={message:'Publish SIGN WELL articles '+new Date().toISOString().slice(0,19).replace('T',' '),content:utf8Base64(publishedJSText()),branch};if(sha)payload.sha=sha;
  const result=await githubRequest(base,token,{method:'PUT',body:JSON.stringify(payload)});if(status)status.textContent='✓ 已提交到 GitHub。Pages 通常會在短時間內自動更新。';showToast('GitHub 發布完成');return result;
}
function bindGithubPublisher(){const cfg=loadGithubConfig();if($('#ghOwner'))$('#ghOwner').value=cfg.owner||'';if($('#ghRepo'))$('#ghRepo').value=cfg.repo||'';if($('#ghBranch'))$('#ghBranch').value=cfg.branch||'main';if($('#ghPath'))$('#ghPath').value=cfg.path||'articles.js';$('#ghPublish')?.addEventListener('click',async()=>{try{await publishGitHub()}catch(e){const s=$('#ghStatus');if(s)s.textContent='發布失敗：'+e.message;showToast('GitHub 發布失敗')}});$('#ghTest')?.addEventListener('click',async()=>{const owner=$('#ghOwner').value.trim(),repo=$('#ghRepo').value.trim(),token=$('#ghToken').value.trim()||githubToken,status=$('#ghStatus');if(!owner||!repo||!token){status.textContent='請先填入 Owner、Repository 與 token。';return}githubToken=token;try{status.textContent='正在測試連線…';const r=await githubRequest(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`,token);status.textContent='✓ 已連線：'+r.full_name}catch(e){status.textContent='連線失敗：'+e.message}})}
async function publishOnlineFromEditor(){publishNow();const cfg=loadGithubConfig();if(!cfg.owner||!cfg.repo||!githubToken){nav('export');showToast('請先在 Publish Online 設定 GitHub；token 每次重新開啟後需再輸入');return}try{await publishGitHub()}catch(e){showToast('GitHub 發布失敗');console.error(e)}}
function initCmsPremium(){
  if(window.__cmsPremiumBound)return;window.__cmsPremiumBound=true;
  const fine=matchMedia('(pointer:fine)').matches&&!document.body.classList.contains('lite');if(fine){document.addEventListener('pointermove',e=>{const el=e.target.closest('.lock-card,.stat,.panel');if(!el)return;const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;el.style.setProperty('--px',(x*100)+'%');el.style.setProperty('--py',(y*100)+'%');el.style.setProperty('--ry',((x-.5)*5)+'deg');el.style.setProperty('--rx',((.5-y)*4)+'deg')},{passive:true});document.addEventListener('pointerout',e=>{const el=e.target.closest?.('.lock-card,.stat,.panel');if(!el||e.relatedTarget&&el.contains(e.relatedTarget))return;el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')},{passive:true})}
  document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;b.classList.remove('jelly');void b.offsetWidth;b.classList.add('jelly');setTimeout(()=>b.classList.remove('jelly'),620)},{passive:true});
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in-view');io.unobserve(x.target)}}),{threshold:.07});const scan=()=>document.querySelectorAll('.stat,.panel,.editor-main,.editor-side,.publish-card').forEach(el=>{if(el.dataset.fxBound)return;el.dataset.fxBound='1';el.classList.add('reveal-fx');io.observe(el)});new MutationObserver(scan).observe($('#view'),{childList:true,subtree:true});scan();
}

load();syncPublicSnapshot();optimize();initCmsPremium();setAuthStage(1)
})();
