</style></head><body><main class="wrap"><div class="top"><a href="index.html">SIGN WELL · 欣緯生醫</a><a href="index.html">返回首頁</a></div><section class="card"><h1>取消 SIGN WELL 電子報</h1><p>取消後不會再寄送電子報到這個信箱。網站閱讀不受影響。</p><p><label><input type="radio" name="reason" value="too-frequent"> 寄送太頻繁</label><br><label><input type="radio" name="reason" value="not-relevant"> 內容與需求不符</label><br><label><input type="radio" name="reason" value="temporary"> 暫時不想收到</label><br><label><input type="radio" name="reason" value="other"> 其他</label></p><textarea id="reasonNote" maxlength="240" placeholder="其他想告訴 SIGN WELL 的內容（選填）"></textarea><p><button id="unsubscribeBtn">確認取消訂閱</button></p><div class="status" id="status"></div></section></main><script src="analytics-config.js"></script><script>(()=>{'use strict';const q=s=>document.querySelector(s);const token=new URLSearchParams(location.search).get('t')||'';function cfg(){const a=window.SIGNWELL_ANALYTICS||{},n=window.SIGNWELL_NEWSLETTER||{};const e=String(n.endpoint||a.endpoint||'').trim();return {endpoint:e,enabled:(n.enabled===true||a.enabled===true)&&/^https:\/\/script\.google\.com\/macros\/s\//i.test(e)}}function bridge(payload){return new Promise((resolve,reject)=>{const c=cfg();if(!c.enabled)return reject(new Error('後端尚未完成同步'));const id='swu_'+Date.now().toString(36),fr=document.createElement('iframe'),fm=document.createElement('form');fr.name='f_'+id;Object.assign(fr.style,{position:'fixed',width:'1px',height:'1px',opacity:'0',left:'-9999px'});fm.method='POST';fm.action=c.endpoint;fm.target=fr.name;fm.style.display='none';const add=(n,v)=>{const x=document.createElement('input');x.type='hidden';x.name=n;x.value=String(v??'');fm.appendChild(x)};add('transport','iframe');add('requestId',id);add('returnOrigin',location.origin);add('action','newsletter.unsubscribe');add('payload',JSON.stringify(payload));let t;const clean=()=>{clearTimeout(t);removeEventListener('message',on);fm.remove();fr.remove()};const on=e=>{const d=e.data;if(!d||d.source!=='SIGNWELL_GAS'||d.requestId!==id)return;clean();d.ok?resolve(d.data||{}):reject(new Error(d.error||'取消訂閱失敗'))};addEventListener('message',on);t=setTimeout(()=>{clean();reject(new Error('後端連線逾時'))},30000);document.body.append(fr,fm);fm.submit()})}q('#unsubscribeBtn').onclick=async()=>{const s=q('#status');s.className='status';s.textContent='正在更新…';try{const r=await bridge({token,reason:q('input[name=reason]:checked')?.value||'skipped',note:q('#reasonNote').value||''});s.className='status success';s.textContent=r.message||'已取消訂閱。'}catch(e){s.className='status error';s.textContent=e.message||'取消訂閱失敗'}}})();</script></body></html>
