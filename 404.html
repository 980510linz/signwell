<!doctype html>
<html class="sw-v2421" lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="signwell-release" content="24.25.1-STAGING">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#edf2ef">
<!-- Current production is a GitHub Pages project site. A fixed project base keeps
     404 assets + recovery routes inside /signwell.com/ instead of accidentally requesting
     domain-root /assets or /index.html. Change this only when customDomainEnabled
     is deliberately promoted in a future release. -->
<base href="/signwell.com/">
<title>404 · SIGN WELL</title>
<link rel="stylesheet" href="assets/signwell-dark-reset-v24.0.13.css?build=24.0.13-STAGING">
<link rel="stylesheet" href="assets/components/shared/14-signwell-error-experience-v24.10.0.css?build=24.10.0-STAGING">
<link rel="stylesheet" href="assets/signwell-fluid-loader.css?build=24.11.0">
</head>
<body style="margin:0;background:#edf2ef">
<main id="swErrorRoot"></main>
<script src="assets/bundles/error-experience-v24.10.0.js?build=24.10.0-STAGING"></script>
<script>
(()=>{
  const p=location.pathname;
  const m=p.match(/\/article\/([^/]+)\/?$/i);
  if(m){
    let slug='';
    try{slug=decodeURIComponent(m[1])}catch(_){slug=m[1]}
    const u=new URL('index.html',document.baseURI);
    u.searchParams.set('article',slug);
    const section=new URLSearchParams(location.search).get('s');
    if(section)u.searchParams.set('s',section);
    location.replace(u.href);
    return;
  }
  let code='SW-PUB-404-ROUTE-NOT-FOUND',reason='要求的頁面或資源不存在。',module='routing';
  if(/\/article\//i.test(p)){
    code='SW-PUB-404-ARTICLE-ROUTE';
    reason='這個文章網址沒有對應的公開內容；文章可能已撤下、尚未發布或網址已更新。';
    module='article-router';
  }else if(/\/trace\//i.test(p)){
    code='SW-PUB-404-TRACE-ROUTE';
    reason='這個 Article ID 沒有對應的公開溯源頁，或該身分紀錄尚未發布。';
    module='article-trace';
  }
  window.SignWellErrors.renderInto(
    document.getElementById('swErrorRoot'),
    new Error(reason),
    {surface:'PUB',status:404,errorCode:code,module,action:'github-pages-404',homeUrl:document.baseURI}
  );
})();
</script>
<script src="assets/signwell-fluid-loader.js?build=24.11.0" defer></script>
</body>
</html>
